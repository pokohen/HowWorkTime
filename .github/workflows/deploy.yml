name: 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'  # 매일 KST 03:00 (UTC 18:00) — 공휴일 데이터 갱신
  workflow_dispatch:

# 기본은 읽기 전용. 쓰기 권한은 필요한 job 에만 준다.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      changed: ${{ steps.decide.outputs.changed }}
      fetched: ${{ steps.fetch.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Node 내장 기능만 쓰는 스크립트라 의존성 설치 전에 실행한다.
      # 실패하면 이 단계에 경고 표시만 남기고, 커밋된 데이터로 계속 진행한다.
      - name: 공휴일 데이터 가져오기
        id: fetch
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetchHolidays.js

      # 예약 실행은 공휴일 데이터가 커밋된 것과 달라졌을 때만 배포한다 (매일 같은 내용을 재배포하지 않도록)
      - name: 배포 여부 결정
        id: decide
        run: |
          changed=false
          git diff --quiet -- src/data/holidays.json || changed=true
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$changed" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "공휴일 데이터 변경 없음 — 배포를 건너뜁니다"
          fi

      # 배포가 끝난 뒤 commit-data job 이 저장소에 반영할 수 있도록 넘겨준다
      - if: steps.decide.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: holidays-data
          path: src/data/holidays.json

      - if: steps.decide.outputs.deploy == 'true'
        uses: pnpm/action-setup@v4 # 버전은 package.json 의 packageManager 를 따른다

      - if: steps.decide.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - if: steps.decide.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.decide.outputs.deploy == 'true'
        run: pnpm test

      - if: steps.decide.outputs.deploy == 'true'
        run: pnpm build

      - if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 배포까지 성공한 뒤에만 갱신된 공휴일 데이터를 저장소에 남긴다.
  # 빌드·배포가 실패하면 커밋되지 않으므로 다음 예약 실행이 다시 차이를 감지해 재시도한다.
  # 쓰기 권한은 이 job 에만 있고, 의존성 설치나 빌드 코드는 여기서 실행되지 않는다.
  # GITHUB_TOKEN 으로 한 푸시는 워크플로우를 다시 트리거하지 않는다.
  commit-data:
    needs: [build, deploy]
    if: needs.build.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 빌드·배포 사이에 main 이 앞서갔을 수 있으므로 트리거 SHA 가 아니라 브랜치 끝에서 커밋한다
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # 트리거 시점 커밋과 비교하기 위해

      - uses: actions/download-artifact@v4
        with:
          name: holidays-data
          path: src/data

      - name: 갱신된 공휴일 데이터 커밋
        run: |
          if ! git cat-file -e "${{ github.sha }}^{commit}" 2>/dev/null; then
            echo "::error::트리거 커밋을 찾을 수 없어(히스토리 재작성?) 공휴일 데이터를 커밋하지 못했습니다"
            exit 1
          fi
          # 빌드하는 동안 main 의 데이터가 바뀌었다면 그쪽이 더 새 것이므로 덮어쓰지 않는다
          if ! git diff --quiet ${{ github.sha }} HEAD -- src/data/holidays.json; then
            echo "main 의 공휴일 데이터가 이미 바뀌어 건너뜁니다"
            exit 0
          fi
          if git diff --quiet -- src/data/holidays.json; then
            echo "이미 반영되어 있습니다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/holidays.json
          git commit -m "chore: 공휴일 데이터 갱신"
          git push || { git pull --rebase && git push; }

  # 예약 실행(공휴일 갱신이 목적)에서 갱신이 실패하면 이 job 을 실패시켜 실행 결과에 드러나게 한다.
  # (키 만료 등으로 데이터가 조용히 낡는 것을 막기 위함. 푸시 실행의 일시적 API 오류로는 실패 처리하지 않는다)
  data-health:
    needs: build
    if: github.event_name == 'schedule' && needs.build.outputs.fetched != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::공휴일 데이터 갱신에 실패했습니다. DATA_GO_KR_KEY 와 API 상태를 확인하세요. 배포는 커밋된 데이터로 진행됩니다."
          exit 1
