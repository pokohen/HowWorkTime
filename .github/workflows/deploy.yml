name: 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'  # 매일 KST 03:00 (UTC 18:00) — 공휴일 데이터 갱신
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 버전은 package.json 의 packageManager 를 따른다

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 실패하면 이 단계에 경고 표시만 남기고, 커밋된 데이터로 계속 진행한다
      - name: 공휴일 데이터 가져오기
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: pnpm prefetch:holidays

      # 예약 실행은 공휴일 데이터가 커밋된 것과 달라졌을 때만 배포한다 (매일 같은 내용을 재배포하지 않도록)
      - name: 배포 여부 결정
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || ! git diff --quiet -- src/data/holidays.json; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "공휴일 데이터 변경 없음 — 배포를 건너뜁니다"
          fi

      - if: steps.decide.outputs.deploy == 'true'
        run: pnpm test

      - if: steps.decide.outputs.deploy == 'true'
        run: pnpm build

      - if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
